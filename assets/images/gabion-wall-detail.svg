<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" style="width:100%;height:auto;display:block;">
            <rect width="460" height="300" fill="#18181B"/>
            <!-- slope backfill -->
            <path d="M280,40 L420,40 L420,270 L280,120 Z" fill="#221F1D"/>
            <!-- gabion baskets, stepped -->
            <rect x="120" y="210" width="160" height="60" fill="none" stroke="#3A3632"/>
            <rect x="150" y="150" width="130" height="60" fill="none" stroke="#3A3632"/>
            <rect x="180" y="90" width="100" height="60" fill="none" stroke="#3A3632"/>
            <!-- stone fill texture (dots) -->
            <g fill="#6E6B66" opacity="0.5">
              <circle cx="140" cy="230" r="4"/><circle cx="170" cy="245" r="5"/><circle cx="200" cy="228" r="4"/><circle cx="230" cy="248" r="5"/><circle cx="260" cy="230" r="4"/>
              <circle cx="170" cy="170" r="4"/><circle cx="200" cy="185" r="5"/><circle cx="230" cy="168" r="4"/><circle cx="255" cy="188" r="4"/>
              <circle cx="200" cy="110" r="4"/><circle cx="230" cy="125" r="5"/><circle cx="255" cy="108" r="4"/>
            </g>
            <!-- footing -->
            <rect x="110" y="270" width="180" height="16" fill="#2A2622" stroke="#A1A1AA"/>
            <!-- labels -->
            <text x="290" y="70" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Stable Slope Backfill</text>
            <text x="30" y="150" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Step-Back per Layer</text>
            <text x="60" y="295" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Gravel Foundation Bed</text>
            <path d="M120,210 L150,210" stroke="#8FA98A" stroke-width="1.5"/>
            <path d="M150,150 L180,150" stroke="#8FA98A" stroke-width="1.5"/>
          </svg>