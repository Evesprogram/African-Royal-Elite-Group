<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" style="width:100%;height:auto;display:block;">
  <rect width="460" height="300" fill="#18181B"/>
  <!-- ground / grass line -->
  <rect x="30" y="40" width="400" height="14" fill="#3A3632"/>
  <!-- soil -->
  <rect x="30" y="54" width="400" height="220" fill="#221F1D"/>
  <!-- trench cut -->
  <path d="M160,54 L160,240 L300,240 L300,54 Z" fill="#18181B" stroke="#3A3632" stroke-width="1.5"/>
  <!-- filter fabric wrap -->
  <path d="M170,60 L170,230 L290,230 L290,60" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- graded gravel -->
  <rect x="172" y="90" width="116" height="140" fill="#3A342E" stroke="#3A3632"/>
  <g fill="#4A4038" opacity="0.7">
    <circle cx="190" cy="105" r="5"/><circle cx="210" cy="115" r="6"/><circle cx="232" cy="100" r="5"/>
    <circle cx="252" cy="112" r="6"/><circle cx="272" cy="102" r="5"/><circle cx="195" cy="140" r="6"/>
    <circle cx="220" cy="150" r="5"/><circle cx="245" cy="138" r="6"/><circle cx="268" cy="148" r="5"/>
    <circle cx="200" cy="180" r="5"/><circle cx="225" cy="190" r="6"/><circle cx="250" cy="178" r="5"/>
    <circle cx="272" cy="188" r="6"/>
  </g>
  <!-- perforated pipe -->
  <circle cx="230" cy="210" r="20" fill="#18181B" stroke="#F5F3EF" stroke-width="2"/>
  <g stroke="#8FA98A" stroke-width="1.5">
    <circle cx="222" cy="203" r="1.6" fill="#8FA98A"/>
    <circle cx="238" cy="203" r="1.6" fill="#8FA98A"/>
    <circle cx="230" cy="196" r="1.6" fill="#8FA98A"/>
    <circle cx="222" cy="217" r="1.6" fill="#8FA98A"/>
    <circle cx="238" cy="217" r="1.6" fill="#8FA98A"/>
  </g>
  <!-- outlet arrow -->
  <path d="M250,210 L300,210" fill="none" stroke="#8FA98A" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8FA98A"/>
    </marker>
  </defs>

  <!-- labels -->
  <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="11" fill="#6E6B66" letter-spacing="0.5">FRENCH DRAIN — TRENCH SECTION</text>
  <text x="20" y="48" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Grade</text>
  <text x="305" y="70" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Filter Fabric Wrap</text>
  <text x="305" y="130" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Graded Gravel</text>
  <text x="305" y="215" font-family="JetBrains Mono, monospace" font-size="10" fill="#F5F3EF">Perforated Pipe</text>
  <text x="305" y="230" font-family="JetBrains Mono, monospace" font-size="10" fill="#8FA98A">→ Outlet / Discharge</text>

  <!-- dimension line -->
  <line x1="160" y1="260" x2="300" y2="260" stroke="#6E6B66" stroke-width="1" opacity="0.6"/>
  <line x1="160" y1="253" x2="160" y2="267" stroke="#6E6B66" stroke-width="1" opacity="0.6"/>
  <line x1="300" y1="253" x2="300" y2="267" stroke="#6E6B66" stroke-width="1" opacity="0.6"/>
  <text x="185" y="280" font-family="JetBrains Mono, monospace" font-size="10" fill="#6E6B66" opacity="0.7">TRENCH WIDTH — REF</text>
</svg>
