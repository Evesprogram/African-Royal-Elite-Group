<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" style="width:100%;height:auto;display:block;">
            <rect width="460" height="300" fill="#18181B"/>
            <!-- backfill soil -->
            <rect x="230" y="40" width="190" height="230" fill="#221F1D"/>
            <!-- wall -->
            <path d="M230,40 L250,40 L250,270 L190,270 L190,60 Z" fill="#2A2622" stroke="#A1A1AA" stroke-width="1.5"/>
            <!-- gravel zone -->
            <rect x="250" y="60" width="35" height="200" fill="#4A4038" stroke="#3A3632"/>
            <!-- weep holes -->
            <circle cx="240" cy="120" r="4" fill="#1C1917" stroke="#8FA98A"/>
            <circle cx="240" cy="180" r="4" fill="#1C1917" stroke="#8FA98A"/>
            <!-- pipe at base -->
            <circle cx="267" cy="255" r="9" fill="#1C1917" stroke="#8FA98A" stroke-width="2"/>
            <!-- footing -->
            <rect x="170" y="270" width="150" height="18" fill="#2A2622" stroke="#A1A1AA"/>
            <!-- labels -->
            <text x="330" y="70" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Backfill Soil</text>
            <text x="300" y="115" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Gravel Drain Zone</text>
            <text x="30" y="123" font-family="JetBrains Mono, monospace" font-size="10" fill="#8FA98A" text-anchor="start">Weep Hole →</text>
            <text x="30" y="258" font-family="JetBrains Mono, monospace" font-size="10" fill="#8FA98A" text-anchor="start">Outlet Pipe →</text>
            <text x="150" y="295" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">Reinforced Footing</text>
          </svg>